spring:
  application:
    name: fox-task-manager

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED}

server:
  port: ${APP_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

  admin:
    login: ${ADMIN_LOGIN}
    password: ${ADMIN_PASSWORD}
    display-name: ${ADMIN_DISPLAY_NAME:Admin}
    email: ${ADMIN_EMAIL:}