<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f6f8fb;
        }

        .page-card {
            border-radius: 18px;
        }

        .note-content {
            max-width: 520px;
        }
    </style>
</head>

<body>
<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <span class="badge text-bg-primary mb-2">
                Notes manager
            </span>

            <h1 class="fw-bold mb-1">
                Список нотаток
            </h1>

            <p class="text-muted mb-0">
                Тут можна переглядати, редагувати та видаляти нотатки.
            </p>
        </div>

        <a href="/test" class="btn btn-outline-secondary">
            Test page
        </a>
    </div>

    <div class="card page-card shadow-sm border-0">
        <div class="card-body p-4">
            <div th:if="${#lists.isEmpty(notes)}" class="alert alert-info mb-0">
                Нотаток поки немає.
            </div>

            <div th:if="${!#lists.isEmpty(notes)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Title</th>
                        <th scope="col">Content</th>
                        <th scope="col" class="text-end">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="note : ${notes}">
                        <td>
                            <span class="badge text-bg-light" th:text="${note.id}"></span>
                        </td>

                        <td class="fw-semibold" th:text="${note.title}"></td>

                        <td class="text-muted note-content" th:text="${note.content}"></td>

                        <td class="text-end">
                            <div class="d-inline-flex gap-2">
                                <a th:href="@{/note/edit(id=${note.id})}" class="btn btn-primary btn-sm">
                                    Edit
                                </a>

                                <form th:action="@{/note/delete}" method="post">
                                    <input type="hidden" name="id" th:value="${note.id}">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
