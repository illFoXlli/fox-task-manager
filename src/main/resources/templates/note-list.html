<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нотатки | Fox Task Manager</title>

    <link rel="icon" type="image/png" href="/images/auth/favicon.png">
    <link rel="stylesheet" th:href="@{/styles.css(v=${assetVersion})}">
</head>

<body class="app-page">
<header th:replace="~{fragments/app-header :: header('manage')}"></header>

<main class="notes-shell">
    <section class="notes-hero">
        <div>
            <p class="notes-hero__label">
                Кабінет відкрито
            </p>

            <h1 class="notes-hero__title">
                Список нотаток
            </h1>

            <p class="notes-hero__text">
                Тут живуть твої записи. Поки без зайвої магії, але вже з порядком.
            </p>
        </div>

        <div class="notes-hero__actions">
            <a class="notes-hero__button" th:href="@{/note/create}">
                Створити нотатку
            </a>

            <a class="notes-hero__button" th:href="@{/note/view}">
                Перегляд
            </a>
        </div>
    </section>

    <section class="notes-board" aria-label="Список нотаток">
        <div th:if="${#lists.isEmpty(notes)}" class="notes-empty">
            Нотаток поки немає.
        </div>

        <div th:if="${!#lists.isEmpty(notes)}" class="notes-table-wrap">
            <table
                    class="notes-table"
                    data-sort-table
                    data-sort-storage-key="notes:list"
                    data-default-sort-key="updatedAt"
                    data-default-sort-direction="desc"
            >
                <thead>
                <tr>
                    <th scope="col">
                        <button class="notes-sort-button" type="button" data-sort-key="title">
                            Заголовок
                        </button>
                    </th>
                    <th scope="col">
                        <button class="notes-sort-button" type="button" data-sort-key="content">
                            Текст
                        </button>
                    </th>
                    <th scope="col">
                        <button class="notes-sort-button" type="button" data-sort-key="createdAt">
                            Створено
                        </button>
                    </th>
                    <th scope="col">
                        <button class="notes-sort-button" type="button" data-sort-key="updatedAt">
                            Змінено
                        </button>
                    </th>
                    <th scope="col" aria-label="Дії"></th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="note : ${notes}">
                    <td
                            data-label="Заголовок"
                            data-sort-key="title"
                            class="notes-title"
                            th:attr="data-sort-value=${note.title}"
                            th:text="${note.title}"
                    ></td>

                    <td
                            data-label="Текст"
                            data-sort-key="content"
                            class="notes-content"
                            th:attr="data-sort-value=${note.content}"
                            th:text="${note.content}"
                    ></td>

                    <td
                            data-label="Створено"
                            data-sort-key="createdAt"
                            class="notes-date notes-local-time"
                            th:attr="
                                    data-sort-value=${note.createdAtUtc},
                                    data-utc=${note.createdAtUtc}"
                            th:text="${#temporals.format(note.createdAt, 'dd.MM.yyyy HH:mm') + ' UTC'}"
                    ></td>

                    <td
                            data-label="Змінено"
                            data-sort-key="updatedAt"
                            class="notes-date notes-local-time"
                            th:attr="
                                    data-sort-value=${note.updatedAtUtc},
                                    data-utc=${note.updatedAtUtc}"
                            th:text="${#temporals.format(note.updatedAt, 'dd.MM.yyyy HH:mm') + ' UTC'}"
                    ></td>

                    <td class="notes-actions-cell" aria-label="Дії">
                        <div class="notes-actions">
                            <a class="notes-action notes-action--edit" th:href="@{/note/edit(id=${note.id})}">
                                Edit
                            </a>

                            <form th:action="@{/note/delete}" method="post">
                                <input type="hidden" name="id" th:value="${note.id}">
                                <button class="notes-action notes-action--delete" type="submit">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script type="module" th:src="@{/app.js(v=${assetVersion})}"></script>
</body>
</html>
