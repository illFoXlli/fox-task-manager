<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування нотатки | Fox Task Manager</title>

    <link rel="icon" type="image/png" href="/images/auth/favicon.png">
    <link rel="stylesheet" href="/styles.css?v=1">
</head>

<body class="app-page">
<header class="app-header">
    <a class="app-brand" th:href="@{/note/list}" aria-label="Fox Task Manager">
        <span class="app-brand__mark" aria-hidden="true"></span>
    </a>

    <nav class="app-nav" aria-label="Основна навігація">
        <a class="app-nav__link app-nav__link--active" th:href="@{/note/list}">
            Нотатки
        </a>
    </nav>

    <a class="app-header__action" th:href="@{/login}">
        Вийти
    </a>
</header>

<main class="notes-shell notes-shell--edit">
    <section class="notes-hero notes-hero--edit">
        <div>
            <p class="notes-hero__label">
                Редагування
            </p>

            <h1 class="notes-hero__title">
                Оновити нотатку
            </h1>

            <p class="notes-hero__text">
                Зміни заголовок або текст, а потім збережи результат.
            </p>
        </div>
    </section>

    <section class="notes-board notes-edit-board" aria-label="Форма редагування нотатки">
        <form class="notes-edit-form" th:action="@{/note/edit}" th:object="${note}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label class="form-label" for="title">
                    Заголовок
                </label>

                <input
                        id="title"
                        class="form-control"
                        type="text"
                        th:field="*{title}"
                >

                <p class="form-message">
                    Коротка назва допоможе швидше знайти запис.
                </p>
            </div>

            <div class="form-group">
                <label class="form-label" for="content">
                    Текст
                </label>

                <textarea
                        id="content"
                        class="form-control notes-edit-form__textarea"
                        th:field="*{content}"
                        rows="8"
                ></textarea>

                <p class="form-message">
                    Можна залишити стільки деталей, скільки потрібно.
                </p>
            </div>

            <div class="notes-edit-form__actions">
                <a class="notes-hero__button" th:href="@{/note/list}">
                    Назад до списку
                </a>

                <button class="button button--primary" type="submit">
                    Зберегти зміни
                </button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
