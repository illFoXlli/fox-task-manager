<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f6f8fb;
        }

        .page-card {
            border-radius: 18px;
        }
    </style>
</head>

<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
            <div class="mb-4">
                <span class="badge text-bg-success mb-2">
                    Edit note
                </span>

                <h1 class="fw-bold mb-1">
                    Редагування нотатки
                </h1>

                <p class="text-muted mb-0">
                    Зміни заголовок або текст нотатки та збережи результат.
                </p>
            </div>

            <div class="card page-card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="@{/note/edit}" th:object="${note}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">
                                Title
                            </label>
                            <input id="title" type="text" th:field="*{title}" class="form-control">
                        </div>

                        <div class="mb-4">
                            <label for="content" class="form-label fw-semibold">
                                Content
                            </label>
                            <textarea id="content" th:field="*{content}" rows="7" class="form-control"></textarea>
                        </div>

                        <div class="d-flex justify-content-between gap-3">
                            <a th:href="@{/note/list}" class="btn btn-outline-secondary">
                                Back to list
                            </a>

                            <button type="submit" class="btn btn-success">
                                Save changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
