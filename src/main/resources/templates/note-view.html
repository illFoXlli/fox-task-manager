<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перегляд нотаток | Fox Task Manager</title>

    <link rel="icon" type="image/png" href="/images/auth/favicon.png">
    <link rel="stylesheet" href="/styles.css?v=1">
</head>

<body class="app-page">
<header class="app-header">
    <a class="app-brand" th:href="@{/note/list}" aria-label="Fox Task Manager">
        <span class="app-brand__mark" aria-hidden="true"></span>
    </a>

    <nav class="app-nav" aria-label="Основна навігація">
        <a class="app-nav__link app-nav__link--active" th:href="@{/note/list}">
            Нотатки
        </a>
    </nav>

    <a class="app-header__action" th:href="@{/login}">
        Вийти
    </a>
</header>

<main class="notes-shell">
    <section class="notes-hero">
        <div>
            <p class="notes-hero__label">
                Режим перегляду
            </p>
        </div>

        <a class="notes-hero__button" th:href="@{/note/list}">
            Назад до списку
        </a>
    </section>

    <section class="notes-board" aria-label="Перегляд нотаток">
        <div th:if="${#lists.isEmpty(notes)}" class="notes-empty">
            Нотаток поки немає.
        </div>

        <div th:if="${!#lists.isEmpty(notes)}" class="notes-table-wrap">
            <table class="notes-table notes-table--readonly">
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Заголовок</th>
                    <th scope="col">Текст</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="note : ${notes}">
                    <td data-label="ID">
                        <span class="notes-id" th:text="${note.id}"></span>
                    </td>

                    <td data-label="Заголовок" class="notes-title" th:text="${note.title}"></td>

                    <td data-label="Текст" class="notes-content" th:text="${note.content}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
