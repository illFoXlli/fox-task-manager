spring:
  datasource:
    url: ${DB_URL_TEST}
    username: ${DB_TEST_USER}
    password: ${DB_TEST_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}

  security:
    user:
      name: user
      password: default

app:
  default-user:
    enabled: true
    login: user
    password: jdbcDefault
    display-name: user
    update-password: true

server:
  port: 0
